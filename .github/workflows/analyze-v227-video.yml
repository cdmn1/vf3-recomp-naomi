name: Analyze VF3 v227 video

on:
  push:
    branches:
      - softfloat-rounding-experiment
    paths:
      - .github/workflows/analyze-v227-video.yml

permissions:
  contents: write

jobs:
  extract-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the user-recorded video from main
        run: |
          git fetch origin main
          git show origin/main:tests/vf3_naomi_rev_d-v227.mp4 > /tmp/vf3-v227.mp4
          test -s /tmp/vf3-v227.mp4

      - name: Extract full-resolution frames
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/vf3-v227.mp4
          ffmpeg -hide_banner -loglevel error -ss 1.5 -i /tmp/vf3-v227.mp4 -frames:v 1 tests/vf3_naomi_rev_d-v227-frame-full.png
          file tests/vf3_naomi_rev_d-v227-frame-full.png

      - name: Commit full-resolution frame to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/vf3_naomi_rev_d-v227-frame-full.png
          git commit -m "Add full-resolution v227 video frame [skip ci]"
          git push origin HEAD:softfloat-rounding-experiment
