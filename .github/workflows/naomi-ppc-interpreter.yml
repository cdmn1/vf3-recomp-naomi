name: Naomi PPC interpreter smoke test

on:
  push:
    branches: [main, softfloat-rounding-experiment]
    paths:
      - "tests/ppc_interpreter_smoke/**"
      - "tests/naomi_fpu_probe/**"
      - "tests/naomi_cart_probe/**"
      - "platform/naomi/**"
      - "tools/naomi/test_cart_rom.c"
      - "tools/naomi/test_cart_vrom.c"
      - "tools/naomi/test_cart_image_format.py"
      - "tools/naomi/make_vrom_integration_image.py"
      - "tools/naomi/test_make_vrom_integration_image.py"
      - "tools/naomi/pack_vf3_roms.py"
      - "tools/naomi/test_pack_vf3_roms.py"
      - "VERSION"
      - ".github/workflows/naomi-ppc-interpreter.yml"
  workflow_dispatch:
    inputs:
      pack_real_vf3:
        description: "Download VF3 ROM ZIP from the VF3_ROM_ZIP_URL repository secret, validate all 39 ROMs, and package a real-game NetDIMM image"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ppc-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out VF3 Recomp Naomi
        uses: actions/checkout@v4


      - name: Check out pinned VF3 Recomp source
        id: vf3-source
        uses: actions/checkout@v4
        with:
          repository: mr-finster/vf3-recomp
          ref: 8cb7cc5f5919c9cc33076b5c7bad3ab515654907
          path: vf3-recomp
          fetch-depth: 1

      - name: Record upstream source revision
        id: vf3-source-revision
        run: echo "sha=$(git -C vf3-recomp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out Berkeley SoftFloat
        uses: actions/checkout@v4
        with:
          repository: ucb-bar/berkeley-softfloat-3
          ref: 07ebd29db0cfb55723a79fbbffe99103ef38e305
          path: softfloat
          fetch-depth: 1

      - name: Check out KallistiOS
        id: kos
        uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: master
          path: kos
          fetch-depth: 1

      - name: Record KOS source revision
        id: kos-revision
        run: echo "sha=$(git -C kos rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore compiled Naomi KOS cache
        id: kos-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/kos-naomi-build.tar
          key: vf3-recomp-kos-naomi-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('.github/workflows/naomi-ppc-interpreter.yml') }}-v1

      - name: Overlay cached KOS source and build outputs
        if: steps.kos-cache.outputs.cache-hit == 'true'
        run: tar -xf .cache/kos-naomi-build.tar -C kos

      - name: Install KOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo gettext \
            libjpeg-dev libpng-dev libelf-dev \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            zlib1g-dev libncurses-dev pkg-config \
            git subversion python3 wget curl

      - name: Restore SH-4 toolchain cache
        id: sh-toolchain
        uses: actions/cache/restore@v4
        with:
          path: .toolchain/sh-elf
          key: vf3-recomp-sh-elf-gcc15-${{ runner.os }}-naomi-v1

      - name: Build SH-4 toolchain if cache is empty
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          mkdir -p "$KOS_CC_BASE"
          if [ ! -x "$KOS_CC_BASE/bin/sh-elf-gcc" ]; then
            cp "$KOS_BASE/utils/kos-chain/Makefile.dreamcast.cfg" \
               "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            sed -i \
              -e "s|^toolchain_path=.*|toolchain_path=$KOS_CC_BASE|" \
              -e 's|^makejobs=.*|makejobs=4|' \
              -e 's|^enable_objc=.*|enable_objc=0|' \
              -e 's|^enable_objcpp=.*|enable_objcpp=0|' \
              -e 's|^precision_modes=.*|precision_modes=m4-single|' \
              "$KOS_BASE/utils/kos-chain/Makefile.cfg"
            make -C "$KOS_BASE/utils/kos-chain"
          fi

      - name: Save SH-4 toolchain cache
        if: steps.sh-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolchain/sh-elf
          key: vf3-recomp-sh-elf-gcc15-${{ runner.os }}-naomi-v1

      - name: Configure and build KOS for Naomi
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kos-ports/include" \
                   "$GITHUB_WORKSPACE/kos-ports/lib"
          cat > "$KOS_BASE/environ.sh" <<'EOF'
          export KOS_TOOLCHAIN="gcc"
          export KOS_ARCH="dreamcast"
          export KOS_SUBARCH="naomi"
          export KOS_BASE="${GITHUB_WORKSPACE}/kos"
          export KOS_PORTS="${GITHUB_WORKSPACE}/kos-ports"
          export KOS_CC_BASE="${GITHUB_WORKSPACE}/.toolchain/sh-elf"
          export KOS_CC_PREFIX="sh-elf"
          export DC_ARM_BASE="${GITHUB_WORKSPACE}/.toolchain/arm-eabi"
          export DC_ARM_PREFIX="arm-eabi"
          export DC_TOOLS_BASE="${GITHUB_WORKSPACE}/.toolchain/bin"
          export KOS_GENROMFS="${KOS_BASE}/utils/genromfs/genromfs"
          export KOS_CMAKE_TOOLCHAIN="${KOS_BASE}/utils/cmake/kallistios.toolchain.cmake"
          export KOS_MAKE="make"
          export KOS_CFLAGS="-O2 -fno-PIC -fno-PIE -fomit-frame-pointer"
          export KOS_SH4_PRECISION="-m4-single"
          . "${KOS_BASE}/env/environ_base.sh"
          EOF
          export KOS_SUBARCH=naomi
          export KOS_INC_PATHS=""
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C "$KOS_BASE" -j2

      - name: Test synthetic VROM integration image generator
        run: |
          set -eo pipefail
          python3 -m unittest tools/naomi/test_make_vrom_integration_image.py
          python3 -m unittest tools/naomi/test_pack_vf3_roms.py

      - name: Archive compiled Naomi KOS tree
        if: steps.kos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache
          tar --exclude=.git -cf .cache/kos-naomi-build.tar -C kos .

      - name: Save compiled Naomi KOS cache
        if: steps.kos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/kos-naomi-build.tar
          key: vf3-recomp-kos-naomi-${{ runner.os }}-${{ steps.kos-revision.outputs.sha }}-${{ hashFiles('.github/workflows/naomi-ppc-interpreter.yml') }}-v1

      - name: Build Berkeley SoftFloat for Naomi SH-4
        env:
          KOS_CC_BASE: ${{ github.workspace }}/.toolchain/sh-elf
        run: |
          set -eo pipefail
          cd softfloat/build/Linux-x86_64-GCC
          cp ../Linux-ARM-VFPv2-GCC/platform.h platform.h
          make clean
          make \
            COMPILE_C="$KOS_CC_BASE/bin/sh-elf-gcc -c -Werror-implicit-function-declaration -DSOFTFLOAT_FAST_INT64 -DINLINE_LEVEL=5 -DSOFTFLOAT_FAST_DIV32TO16 -DSOFTFLOAT_FAST_DIV64TO32 -I. -I../../source/8086-SSE -I../../source/include -O2 -m4-single -fno-PIC -fno-PIE -o \$@" \
            MAKELIB="$KOS_CC_BASE/bin/sh-elf-ar crs \$@"
          test -s softfloat.a
          file softfloat.a

      - name: Compile upstream PPC interpreter for SH-4
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          VF3_RECOMP_DIR: ${{ github.workspace }}/vf3-recomp
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/ppc_interpreter_smoke clean all
          test -s tests/ppc_interpreter_smoke/vf3_ppc_interpreter_smoke.elf

      - name: Compile upstream Model 3 board core for Naomi SH-4
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          VF3_RECOMP_DIR: ${{ github.workspace }}/vf3-recomp
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/ppc_interpreter_smoke model3-compile
          test -s tests/ppc_interpreter_smoke/model3.o

      - name: Link Naomi NetDIMM VROM and SceneBuilder integration ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          VF3_RECOMP_DIR: ${{ github.workspace }}/vf3-recomp
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/ppc_interpreter_smoke model3-integration
          test -s tests/ppc_interpreter_smoke/naomi_model3_vrom_integration.elf

      - name: Compile Naomi cartridge PIO read probe
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_cart_probe clean all
          test -s tests/naomi_cart_probe/naomi_cart_read_probe.elf

      - name: Compile SH-4 FPU rounding probe
        if: always()
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          make -C tests/naomi_fpu_probe clean all
          test -s tests/naomi_fpu_probe/naomi_sh4_fpu_probe.elf

      - name: Package Naomi test ROM
        env:
          KOS_BASE: ${{ github.workspace }}/kos
          VF3_RECOMP_DIR: ${{ github.workspace }}/vf3-recomp
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/ppc_interpreter_smoke rom
          ROM="vf3_ppc_interpreter_smoke-v${GITHUB_RUN_NUMBER}.bin"
          test -s "tests/ppc_interpreter_smoke/$ROM"
          mkdir -p build-artifacts
          cp "tests/ppc_interpreter_smoke/$ROM" build-artifacts/
          FPU_ROM="naomi_sh4_fpu_probe-v${GITHUB_RUN_NUMBER}.bin"
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_fpu_probe rom
          test -s "tests/naomi_fpu_probe/$FPU_ROM"
          cp "tests/naomi_fpu_probe/$FPU_ROM" build-artifacts/
          CART_ROM="naomi_cart_read_probe-v${GITHUB_RUN_NUMBER}.bin"
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_cart_probe rom
          test -s "tests/naomi_cart_probe/$CART_ROM"
          python3 - "tests/naomi_cart_probe/$CART_ROM" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          with path.open("r+b") as image:
              image.truncate(0x04000000)
              for index, offset in enumerate((
                  0x00100000, 0x00200000, 0x00300000, 0x00400000,
                  0x00800000, 0x01000000, 0x02000000, 0x03F00000,
              ), 1):
                  image.seek(offset)
                  image.write(("VF3PIO%d!" % index).encode("ascii"))
              payload = bytearray(0x00400000)
              for word_index in range(len(payload) // 2):
                  word = 0xA500 ^ ((word_index * 73 + (word_index >> 5)) & 0xFFFF)
                  payload[word_index * 2:word_index * 2 + 2] = word.to_bytes(2, "big")
              payload[:8] = b"VF3PIO1!"
              image.seek(0x02400000)
              image.write(payload)
          PY
          test "$(stat -c '%s' "tests/naomi_cart_probe/$CART_ROM")" -eq 67108864
          cp "tests/naomi_cart_probe/$CART_ROM" build-artifacts/
          INTEGRATION_ROM="naomi_model3_vrom_integration-v${GITHUB_RUN_NUMBER}.bin"
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/ppc_interpreter_smoke integration-rom
          python3 tools/naomi/make_vrom_integration_image.py \
            "tests/ppc_interpreter_smoke/$INTEGRATION_ROM" \
            "build-artifacts/$INTEGRATION_ROM"
          test -s "build-artifacts/$INTEGRATION_ROM"
          test -s "build-artifacts/$INTEGRATION_ROM.json"
          INTEGRATION_SIZE="$(stat -c '%s' "build-artifacts/$INTEGRATION_ROM")"
          INTEGRATION_SHA="$(sha256sum "build-artifacts/$INTEGRATION_ROM" | awk '{print $1}')"
          cat > "build-artifacts/$INTEGRATION_ROM.INFO.txt" <<EOF
          Target: Naomi NetDIMM VROM and SceneBuilder integration probe
          Project commit: ${GITHUB_SHA}
          GitHub Actions run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${INTEGRATION_ROM}
          Size: ${INTEGRATION_SIZE}
          SHA-256: ${INTEGRATION_SHA}
          Payload offset: 0x01000000
          Commercial game data: not included
          EOF

# [pack-real-vf3] Retry real-ROM packaging with shell-safe executable-relative payload offset
      # Download, verify and package user-supplied VF3 Revision D ROMs; guarded by pack_real_vf3
      # [pack-real-vf3] Force a verified rebuild of the corrected in-place real-ROM payload.
      # [pack-real-vf3] Build the real-ROM image using the fixed runtime payload slot.
      # [pack-real-vf3] Package real ROMs by replacing the fixed-offset synthetic fixture.
      # [pack-real-vf3] Verify mounted program ROM and replace synthetic payload with real VF3 data.
      # [pack-real-vf3] Run real PPC reset-ROM execution and live SceneBuilder probe.
      - name: Download, verify and package user-supplied VF3 Revision D ROMs
        if: (github.event_name == 'workflow_dispatch' && inputs.pack_real_vf3) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pack-real-vf3]'))
        env:
          VF3_ROM_ZIP_URL: ${{ secrets.VF3_ROM_ZIP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VF3_ROM_ZIP_URL:-}" ]; then
            echo "::error::Repository secret VF3_ROM_ZIP_URL is not configured."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "$VF3_ROM_ZIP_URL" --output "$RUNNER_TEMP/vf3-roms.zip"
          unzip -t "$RUNNER_TEMP/vf3-roms.zip" >/dev/null
          ROM="naomi_model3_vrom_integration-v${GITHUB_RUN_NUMBER}.bin"
          OUTPUT="vf3_naomi_rev_d-v${GITHUB_RUN_NUMBER}.bin"
          echo "VF3 ROM payload offset: 16777216 (replace synthetic payload in place)"
          python3 tools/naomi/pack_vf3_roms.py \
            "build-artifacts/$ROM" "$RUNNER_TEMP/vf3-roms.zip" \
            "build-artifacts/$OUTPUT"
          SIZE="$(stat -c '%s' "build-artifacts/$OUTPUT")"
          SHA="$(sha256sum "build-artifacts/$OUTPUT" | awk '{print $1}')"
          cat > "build-artifacts/$OUTPUT.INFO.txt" <<EOF
          Target: VF3 Revision D real-game NetDIMM image
          Project commit: ${GITHUB_SHA}
          GitHub Actions run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${OUTPUT}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Payload offset: 0x01000000 (synthetic payload replaced in place)
          Source ROM ZIP: user-supplied Dropbox file (not included in artifact)
          ROM validation: 39 expected ROMs, CRC32 and exact size checked by packer
          Commercial game data: not included in repository
          EOF

      - name: Package SH-4 FPU probe independently
        if: always()
        env:
          KOS_BASE: ${{ github.workspace }}/kos
        run: |
          set -eo pipefail
          export KOS_SUBARCH=naomi
          . "$KOS_BASE/environ.sh"
          export KOS_INC_PATHS_CPP=""
          FPU_ROM="naomi_sh4_fpu_probe-v${GITHUB_RUN_NUMBER}.bin"
          BUILD_VERSION="v${GITHUB_RUN_NUMBER}" make -C tests/naomi_fpu_probe rom
          test -s "tests/naomi_fpu_probe/$FPU_ROM"
          mkdir -p fpu-probe-artifact
          cp "tests/naomi_fpu_probe/$FPU_ROM" fpu-probe-artifact/

      - name: Upload SH-4 FPU probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naomi-sh4-fpu-probe-v${{ github.run_number }}
          path: fpu-probe-artifact/*
          if-no-files-found: error

      - name: Validate and describe ROM
        run: |
          set -euo pipefail
          ROM="vf3_ppc_interpreter_smoke-v${GITHUB_RUN_NUMBER}.bin"
          SIZE="$(stat -c '%s' "build-artifacts/$ROM")"
          SHA="$(sha256sum "build-artifacts/$ROM" | awk '{print $1}')"
          test "$SIZE" -gt 0
          cat > build-artifacts/BUILD_INFO.txt <<EOF
          Target: VF3 Recomp upstream PPC interpreter smoke test
          Project commit: ${GITHUB_SHA}
          Upstream VF3 Recomp commit: ${{ steps.vf3-source-revision.outputs.sha }}
          KallistiOS commit: ${{ steps.kos-revision.outputs.sha }}
          GitHub Actions run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${ROM}
          Size: ${SIZE}
          SHA-256: ${SHA}
          Commercial game data: not included
          EOF
          FPU_ROM="naomi_sh4_fpu_probe-v${GITHUB_RUN_NUMBER}.bin"
          FPU_SIZE="$(stat -c '%s' "build-artifacts/$FPU_ROM")"
          FPU_SHA="$(sha256sum "build-artifacts/$FPU_ROM" | awk '{print $1}')"
          test "$FPU_SIZE" -gt 0
          cat > build-artifacts/FPU_PROBE_INFO.txt <<EOF
          Target: Naomi SH-4 FPU rounding probe
          Project commit: ${GITHUB_SHA}
          GitHub Actions run: ${GITHUB_RUN_ID}
          Build version: v${GITHUB_RUN_NUMBER}
          ROM: ${FPU_ROM}
          Size: ${FPU_SIZE}
          SHA-256: ${FPU_SHA}
          Commercial game data: not included
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Naomi SH-4 FPU rounding probe
          - ROM: ${FPU_ROM}
          - Size: ${FPU_SIZE} bytes
          - SHA-256: ${FPU_SHA}

          ## Naomi PPC interpreter smoke ROM
          - Version: v${GITHUB_RUN_NUMBER}
          - ROM: ${ROM}
          - Size: ${SIZE} bytes
          - SHA-256: ${SHA}
          - Upstream source: ${{ steps.vf3-source-revision.outputs.sha }}
          - KOS revision: ${{ steps.kos-revision.outputs.sha }}
          EOF

      - name: Upload Naomi test ROM
        uses: actions/upload-artifact@v4
        with:
          name: vf3-recomp-naomi-ppc-smoke-v${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error

      - name: Upload Naomi Model 3 VROM integration ROM
        uses: actions/upload-artifact@v4
        with:
          name: naomi-model3-vrom-integration-v${{ github.run_number }}
          path: build-artifacts/naomi_model3_vrom_integration-v${{ github.run_number }}.bin*
          if-no-files-found: error

      - name: Upload real VF3 Revision D NetDIMM image
        if: (github.event_name == 'workflow_dispatch' && inputs.pack_real_vf3) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pack-real-vf3]'))
        uses: actions/upload-artifact@v4
        with:
          name: vf3-naomi-rev-d-v${{ github.run_number }}
          path: build-artifacts/vf3_naomi_rev_d-v${{ github.run_number }}.bin*
          if-no-files-found: error
